spring.application.name=transaction-processor
spring.main.web-application-type=none
spring.main.banner-mode=off
spring.main.log-startup-info=false
spring.datasource.url=jdbc:h2:file:./data/transactions;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=1
spring.sql.init.mode=always
logging.level.root=WARN
logging.level.com.example.transactions=INFO
logging.pattern.console=%msg%n
processor.input=samples/transactions.jsonl
processor.max-attempts=3
processor.retry-delay-ms=100
processor.simulated-failures=0
processor.simulated-failure-stage=AFTER_LEDGER
processor.run-enabled=true
